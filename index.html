<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F1215" />
    <meta name="color-scheme" content="dark" />
    <!-- No icon is declared on purpose. A favicon is the logo at 32px, and the
         official SVG has not been supplied (PENDING_DECISIONS P-001); drawing
         one would be inventing a brand mark. This empty declaration stops the
         browser requesting /favicon.ico and 404-ing on every page. Replace the
         href with the real icon when P-001 closes. -->
    <link rel="icon" href="data:," />
    <title>Damon — Materie prime per la trasformazione delle materie plastiche</title>
    <!--app-head-->
    <!-- Pre-hydration defaults, replaced per route by scripts/prerender.ts and
         by src/lib/seo.ts on client-side navigation. `noindex` is the default
         here too, so a crawler reading the shell before either has run still
         gets the fail-closed answer. -->
    <meta
      name="description"
      content="Distribuzione di materie prime per trasformatori di materie plastiche: masterbatch, polimeri, bio-polimeri, additivi, compound e rigenerati."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Damon" />
    <!--/app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
